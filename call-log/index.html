<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Log a Call &mdash; Jersey Junkers Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0a1a2f;--gold:#F5C400;--ink:#1a2230;--line:#dfe5ec;--muted:#6b7683;--green:#2E8B57;--red:#C0392B;--paper:#f4f6f9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;padding:0 0 40px}
  .top{background:var(--navy);padding:14px 20px;display:flex;align-items:center;justify-content:center}
  .top img{height:42px}
  .wrap{max-width:560px;margin:22px auto;padding:0 18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px rgba(10,26,47,.08);overflow:hidden}
  .card-h{background:linear-gradient(180deg,#0d2440,#0a1a2f);color:#fff;padding:20px 22px}
  .card-h h1{font-family:'Archivo',sans-serif;font-weight:900;font-size:20px}
  .card-h p{color:#9fb0c7;font-size:14px;margin-top:4px}
  .cust{background:#f8fafc;border-bottom:1px solid var(--line);padding:16px 22px}
  .cust .cl{font-family:'Archivo',sans-serif;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.06em;color:var(--muted)}
  .cust .cn{font-family:'Archivo',sans-serif;font-weight:900;font-size:20px;color:var(--navy);margin-top:2px}
  .cust .cp{font-size:15px;margin-top:2px}
  .cust .cp a{color:var(--navy);font-weight:700;text-decoration:none}
  .body{padding:22px}
  .fg{margin-bottom:20px}
  .fg label{display:block;font-family:'Archivo',sans-serif;font-weight:800;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);margin-bottom:9px}
  .toggle{display:flex;gap:10px}
  .toggle button{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink);transition:.12s}
  .toggle button:hover{border-color:var(--navy)}
  .toggle button.yes.on{background:var(--green);border-color:var(--green);color:#fff}
  .toggle button.no.on{background:var(--red);border-color:var(--red);color:#fff}
  select,input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,196,0,.18)}
  textarea{resize:vertical;min-height:90px}
  .cond{margin-top:11px}
  .hint{color:var(--muted);font-size:13px;margin-top:6px}
  .sub{width:100%;background:var(--gold);color:#0a1a2f;border:none;border-radius:12px;padding:16px;font-family:'Archivo',sans-serif;font-weight:900;font-size:17px;cursor:pointer;margin-top:6px}
  .sub:hover{filter:brightness(1.04)}
  .sub:disabled{opacity:.5;cursor:not-allowed}
  .done{text-align:center;padding:50px 24px}
  .done .big{font-family:'Archivo',sans-serif;font-weight:900;font-size:26px;color:var(--green)}
  .done .ck{font-size:52px;color:var(--green);margin-bottom:10px}
  .done p{color:var(--muted);margin-top:8px}
  .hidden{display:none}

.tg3{flex-wrap:wrap}
.tg3 button{flex:1 1 30%}
.toggle button.oth.on{background:#5a6572;border-color:#5a6572;color:#fff}
</style>
</head>
<body>
<div class="top"><img src="https://mcusercontent.com/b4304a0ed8543b85186708ba6/images/9c8653bb-c115-69cf-2e4a-fdfd37855ee8.png" alt="Jersey Junkers"></div>
<div class="wrap">
<div class="card" id="card">
<div class="card-h"><h1>Log a Call</h1><p>Quick note so the team knows where this lead stands.</p></div>
<div class="cust">
<div class="cl">Customer</div>
<div class="cn" id="custName">&mdash;</div>
<div class="cp" id="custPhone"></div>
</div>
<div class="body">

<div class="fg">
<label>Did they answer?</label>
<div class="toggle tg3" id="tgAns">
<button type="button" class="yes" data-v="Yes">Yes, answered</button>
<button type="button" class="no" data-v="No">No answer</button>
<button type="button" class="oth" data-v="Other">Other</button>
</div>
<input type="text" id="ansOther" class="cond hidden" placeholder="What happened? (bad number, wrong number, didn&rsquo;t go through, voicemail full...)">
</div>

<div class="fg">
<label>Who called them?</label>
<input type="text" id="who" placeholder="Name of who called">
</div>

<div class="fg">
<label>Was pricing given?</label>
<div class="toggle" id="tgPrice">
<button type="button" class="yes" data-v="Yes">Yes</button>
<button type="button" class="no" data-v="No">No</button>
</div>
<input type="text" id="priceAmt" class="cond hidden" placeholder="What price / range was quoted? (e.g. $299, or $250-350)">
</div>

<div class="fg">
<label>Notes</label>
<textarea id="notes" placeholder="Anything the next person should know — what they wanted, best callback time, objections, etc."></textarea>
</div>

<button class="sub" id="submit">Save to call log &rarr;</button>
</div>
</div>

<div class="card hidden" id="doneCard">
<div class="done">
<div class="ck">&#10003;</div>
<div class="big">Logged!</div>
<p id="doneMsg">The team can see this now. You can close this tab.</p>
</div>
</div>
</div>

<script>
(function(){
  var HOOK="https://hooks.zapier.com/hooks/catch/13137357/4tk6hr4/"; // <-- paste your Zapier catch hook URL here
  var q=new URLSearchParams(location.search);
  var name=q.get("name")||q.get("first_name")||"", last=q.get("last_name")||"";
  var full=(name+" "+last).trim()||"(no name)";
  var phone=q.get("phone")||"";
  document.getElementById("custName").textContent=full;
  var pp=document.getElementById("custPhone");
  if(phone){pp.innerHTML='<span style="color:#6b7683">Phone:</span> <a href="tel:'+phone.replace(/[^0-9+]/g,"")+'">'+phone+'</a>';}

  var answered="", priced="";
  function bindToggle(id,cb){
    var g=document.getElementById(id);
    g.addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b)return;
      [].forEach.call(g.children,function(x){x.classList.remove("on")});
      b.classList.add("on"); cb(b.dataset.v);
    });
  }
  bindToggle("tgAns",function(v){answered=v;document.getElementById("ansOther").classList.toggle("hidden", v!=="Other");});
  bindToggle("tgPrice",function(v){
    priced=v;
    document.getElementById("priceAmt").classList.toggle("hidden", v!=="Yes");
  });
  document.getElementById("who").addEventListener("change",function(){
    document.getElementById("whoOther").classList.toggle("hidden", this.value!=="Other");
  });

  document.getElementById("submit").addEventListener("click",function(){
    if(!answered){ alert("Please pick whether they answered."); return; }
    var who=document.getElementById("who").value.trim();
    if(!who){ alert("Please enter who called."); return; }
    var ansReason=(answered==="Other")?document.getElementById("ansOther").value.trim():"";
    var data={
      customer_name:full, customer_phone:phone,
      answered:answered, answer_detail:ansReason, called_by:who,
      pricing_given:priced||"No",
      price_quoted:(priced==="Yes")?document.getElementById("priceAmt").value.trim():"",
      notes:document.getElementById("notes").value.trim(),
      logged_at:new Date().toLocaleString("en-US",{timeZone:"America/New_York"}),
      source_lead:q.get("source")||""
    };
    var btn=this; btn.disabled=true; btn.textContent="Saving...";
    function done(){
      document.getElementById("card").classList.add("hidden");
      document.getElementById("doneCard").classList.remove("hidden");
      var m=answered==="No"?"Marked as no-answer. The team can follow up.":"Saved. Nice work.";
      document.getElementById("doneMsg").textContent=m+" You can close this tab.";
    }
    if(HOOK.indexOf("hooks.zapier.com")!==-1){
      try{ fetch(HOOK,{method:"POST",mode:"no-cors",body:JSON.stringify(data)}); }catch(_){}
      setTimeout(done,400);
    } else { done(); } // no hook set yet — still show success so it's testable
  });
})();
</script>
</body>
</html>
