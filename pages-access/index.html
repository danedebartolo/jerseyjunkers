<style>

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--cloud);color:var(--ink);line-height:1.5}
  .bar{background:var(--navy);color:#fff;padding:16px 0}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}
  .bar .lg{font-family:'Arial Black',sans-serif;font-weight:900;font-size:19px}
  .bar .lg span{color:var(--gold)}
  /* login */
  .login{max-width:380px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
  .login h1{font-family:'Arial Black',sans-serif;font-size:22px;margin-bottom:6px}
  .login p{color:var(--muted);font-size:14px;margin-bottom:20px}
  .login label{display:block;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
  .login input{width:100%;font-size:15px;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;margin-bottom:14px}
  .login input:focus{outline:none;border-color:var(--navy)}
  .login button{width:100%;background:var(--gold);color:var(--ink);font-family:'Arial Black',sans-serif;font-weight:900;font-size:15px;padding:13px;border:none;border-radius:9px;cursor:pointer}
  .login button:hover{background:#e0b400}
  .err{color:#d64545;font-size:13.5px;margin-bottom:12px;min-height:16px;font-weight:600}
  /* directory */
  #dir{display:none;padding:26px 0 60px}
  .dir-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .dir-head h1{font-family:'Arial Black',sans-serif;font-size:24px}
  .dir-head .count{color:var(--muted);font-size:14px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .tools input{flex:1;min-width:200px;font-size:15px;padding:10px 13px;border:1.5px solid var(--line);border-radius:9px}
  .tools button{background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;color:var(--navy)}
  .tools button:hover{border-color:var(--navy)}
  .cat{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
  .cat h2{font-family:'Arial Black',sans-serif;font-size:15px;background:var(--navy);color:#fff;padding:12px 18px;display:flex;justify-content:space-between}
  .cat h2 span{color:var(--gold);font-weight:400;font-family:system-ui}
  .cat ul{list-style:none}
  .cat li{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px}
  .cat li:last-child{border-bottom:none}
  .cat li:hover{background:var(--cloud)}
  .cat li a{color:var(--navy);text-decoration:none;font-size:14.5px;word-break:break-all}
  .cat li a:hover{text-decoration:underline}
  .cat li .copy{background:var(--cloud);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap}
  .cat li .copy:hover{border-color:var(--navy);color:var(--navy)}
  .hidden{display:none !important}
</style>
</head>
<body>

<div class="bar"><div class="wrap"><div class="lg">JERSEY JUNKERS<span>&reg;</span> · Page Directory</div></div></div>

<!-- LOGIN -->
<div id="login" class="login">
  <h1>Page Directory</h1>
  <p>Enter your credentials to view the full list of site pages.</p>
  <div class="err" id="err"></div>
  <label>Username</label>
  <input type="text" id="u" autocomplete="off" autocapitalize="off">
  <label>Password</label>
  <input type="password" id="p">
  <button onclick="tryLogin()">View Pages →</button>
</div>

<!-- DIRECTORY -->
<div id="dir"><div class="wrap">
  <div class="dir-head">
    <h1>All Pages</h1>
    <div class="count" id="count"></div>
  </div>
  <div class="tools">
    <input type="text" id="filter" placeholder="Filter pages… (type to search)" oninput="doFilter()">

  <div id="list"></div>

function tryLogin(){
  var u=document.getElementById('u').value.trim();
  var p=document.getElementById('p').value;
  if(u==="Dane" && p==="Dane22"){
    document.getElementById('login').style.display='none';
    document.getElementById('dir').style.display='block';
    render();
  } else {
    document.getElementById('err').textContent="Incorrect username or password.";
  }
}
document.getElementById('p').addEventListener('keydown',function(e){ if(e.key==='Enter') tryLogin(); });

function render(){
  var total=0, html='';
  for(var c in DATA){
    var list=DATA[c]; total+=list.length;
    html+='<div class="cat" data-cat="'+c+'"><h2>'+c+' <span>'+list.length+'</span></h2><ul>';
    list.forEach(function(u){
      var full=BASE+u;
      html+='<li data-url="'+full.toLowerCase()+'"><a href="'+full+'" target="_blank">'+full+'</a>'
          +'<button class="copy" onclick="copyOne(this,\''+full+'\')">Copy</button></li>';
    });
    html+='</ul></div>';
  }
  document.getElementById('list').innerHTML=html;
  document.getElementById('count').textContent=total+' pages';
}
function doFilter(){
  var q=document.getElementById('filter').value.toLowerCase();
  document.querySelectorAll('.cat').forEach(function(cat){
    var any=false;
    cat.querySelectorAll('li').forEach(function(li){
      var match=li.getAttribute('data-url').indexOf(q)>-1;
      li.classList.toggle('hidden',!match);
      if(match) any=true;
    });
    cat.classList.toggle('hidden',!any);
  });
}
function copyOne(btn,url){
  navigator.clipboard.writeText(url).then(function(){ var t=btn.textContent; btn.textContent='Copied!'; setTimeout(function(){btn.textContent=t;},1200); });
}
function copyAll(){
  var all=[];
  for(var c in DATA){ DATA[c].forEach(function(u){ all.push(BASE+u); }); }
  navigator.clipboard.writeText(all.join('\n')).then(function(){ alert(all.length+' URLs copied to clipboard'); });
}
