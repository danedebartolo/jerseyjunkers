<style>
  :root{--navy:#003A70;--gold:#F5C400;--ink:#16181d;--cloud:#f4f6f9;--mist:#eef2f6;--line:#e2e7ec;--muted:#5c6773}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--cloud);color:var(--ink);line-height:1.5}
  a{color:var(--navy)}
  .bar{background:var(--navy);color:#fff;padding:14px 0;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .bar-in{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .bar .lg{font-family:'Arial Black',sans-serif;font-weight:900;font-size:18px;white-space:nowrap}
  .bar .lg span{color:var(--gold)}
  .bar .stat{font-size:13px;color:#bcd3e8}
  /* search in bar */
  .searchbox{flex:1;min-width:200px;max-width:440px;position:relative}
  .searchbox input{width:100%;font-size:15px;padding:9px 14px 9px 38px;border:none;border-radius:9px;background:#fff}
  .searchbox input:focus{outline:2px solid var(--gold)}
  .searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}

  .layout{max-width:1180px;margin:0 auto;padding:24px 22px 60px;display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
  /* sidebar */
  .side{position:sticky;top:76px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;max-height:calc(100vh - 100px);overflow:auto}
  .side a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:600}
  .side a:hover{background:var(--mist)}
  .side a .n{background:var(--mist);color:var(--muted);font-size:12px;font-weight:700;padding:1px 8px;border-radius:20px;min-width:26px;text-align:center}
  .side a.active{background:var(--navy);color:#fff}
  .side a.active .n{background:rgba(255,255,255,.2);color:#fff}
  .side .tools{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
  .side button{width:100%;background:var(--cloud);border:1px solid var(--line);border-radius:9px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;color:var(--navy)}
  .side button:hover{border-color:var(--navy)}

  /* content */
  .cat{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:20px;overflow:hidden;scroll-margin-top:76px}
  .cat > h2{font-family:'Arial Black',sans-serif;font-size:16px;background:var(--navy);color:#fff;padding:13px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
  .cat > h2 .r{display:flex;align-items:center;gap:10px}
  .cat > h2 .n{color:var(--navy);background:var(--gold);font-size:12px;font-weight:700;font-family:system-ui;padding:2px 10px;border-radius:20px}
  .cat > h2 .chev{transition:transform .2s;font-size:13px;opacity:.8}
  .cat.collapsed .chev{transform:rotate(-90deg)}
  .cat.collapsed .cat-body{display:none}
  /* subgroup (alpha letters for towns) */
  .subg{border-bottom:1px solid var(--line)}
  .subg:last-child{border-bottom:none}
  .subg h3{font-family:'Arial Black',sans-serif;font-size:13px;color:var(--navy);background:var(--mist);padding:7px 20px;letter-spacing:.03em}
  ul.plist{list-style:none}
  ul.plist li{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 20px}
  ul.plist li:last-child{border-bottom:none}
  ul.plist li:hover{background:var(--cloud)}
  ul.plist li a{text-decoration:none;font-size:14px;word-break:break-all}
  ul.plist li a:hover{text-decoration:underline}
  ul.plist li a .path{color:var(--muted)}
  ul.plist li .copy{flex:none;background:var(--cloud);border:1px solid var(--line);border-radius:7px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--muted)}
  ul.plist li .copy:hover{border-color:var(--navy);color:var(--navy)}
  .hidden{display:none !important}
  .nores{padding:40px 20px;text-align:center;color:var(--muted);font-size:15px}

  @media (max-width:820px){
    .layout{grid-template-columns:1fr;gap:16px}
    .side{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:6px}
    .side a{flex:1;min-width:130px;justify-content:center}
    .side .tools{border:none;margin:0;padding:0;width:100%;display:flex;gap:6px}
    .side .tools button{flex:1}
  }
</style>

wns/stafford-township.html", "/towns/surf-city.html", "/towns/tinton-falls.html", "/towns/toms-river.html", "/towns/trenton.html", "/towns/tuckerton.html", "/towns/union-beach.html", "/towns/upper-freehold-township.html", "/towns/wall-township.html", "/towns/waretown.html", "/towns/warren.html", "/towns/watchung.html", "/towns/west-long-branch.html", "/towns/west-windsor-township.html", "/towns/woodbridge-township.html"]};

// slug helper for anchor ids
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

// split a big list into alphabetical subgroups (used for Town Pages)
function alphaGroups(urls){
  var groups={};
  urls.forEach(function(u){
    // town slug: /towns/aberdeen-township.html -> A
    var name=u.replace(/^\/towns\//,'').replace(/\.html$/,'').replace(/^\//,'');
    var letter=(name[0]||'#').toUpperCase();
    if(!/[A-Z]/.test(letter)) letter='#';
    (groups[letter]=groups[letter]||[]).push(u);
  });
  return groups;
}

function liHTML(u){
  var full=BASE+u;
  // show path prominently, base domain muted
  return '<li data-url="'+full.toLowerCase()+'">'
    +'<a href="'+full+'" target="_blank"><span class="path">'+u+'</span></a>'
    +'<button class="copy" onclick="copyOne(this,\''+full+'\')">Copy</button></li>';
}

function render(){
  var total=0, listHTML='', sideHTML='';
  for(var c in DATA){
    var urls=DATA[c]; total+=urls.length;
    var id='cat-'+slug(c);
    sideHTML+='<a href="#'+id+'" data-cat="'+c+'">'+c+' <span class="n">'+urls.length+'</span></a>';
    var body='';
    // Town Pages (or any list > 30) get alphabetical subgroups
    if(urls.length>30){
      var g=alphaGroups(urls);
      Object.keys(g).sort().forEach(function(letter){
        body+='<div class="subg"><h3>'+letter+'</h3><ul class="plist">';
        g[letter].forEach(function(u){ body+=liHTML(u); });
        body+='</ul></div>';
      });
    } else {
      body+='<ul class="plist">';
      urls.forEach(function(u){ body+=liHTML(u); });
      body+='</ul>';
    }
    listHTML+='<div class="cat" id="'+id+'"><h2 onclick="toggleCat(this)"><span>'+c+'</span>'
      +'<span class="r"><span class="n">'+urls.length+'</span><span class="chev">&#9660;</span></span></h2>'
      +'<div class="cat-body">'+body+'</div></div>';
  }
  // tools in sidebar
  sideHTML+='<div class="tools"><button onclick="expandAll(true)">Expand all</button>'
    +'<button onclick="expandAll(false)">Collapse all</button>'
    +'<button onclick="copyAll()">Copy all URLs</button></div>';
  document.getElementById('list').innerHTML=listHTML;
  document.getElementById('side').innerHTML=sideHTML;
  document.getElementById('stat').textContent=total+' pages';
  // collapse the big Town Pages category by default so it doesn't dominate
  var townCat=document.getElementById('cat-'+slug('Town Pages'));
  if(townCat) townCat.classList.add('collapsed');
}

function toggleCat(h2){ h2.parentElement.classList.toggle('collapsed'); }
function expandAll(open){
  document.querySelectorAll('.cat').forEach(function(c){ c.classList.toggle('collapsed', !open); });
}

function doFilter(){
  var q=document.getElementById('filter').value.toLowerCase().trim();
  var shown=0;
  document.querySelectorAll('.cat').forEach(function(cat){
    var anyCat=false;
    // expand while searching so matches are visible
    if(q) cat.classList.remove('collapsed');
    cat.querySelectorAll('.subg').forEach(function(sg){
      var anySg=false;
      sg.querySelectorAll('li').forEach(function(li){
        var m=li.getAttribute('data-url').indexOf(q)>-1;
        li.classList.toggle('hidden',!m); if(m){anySg=true;anyCat=true;shown++;}
      });
      sg.classList.toggle('hidden',!anySg);
    });
    // lists directly under cat (non-subgrouped)
    cat.querySelectorAll(':scope > .cat-body > ul.plist > li').forEach(function(li){
      var m=li.getAttribute('data-url').indexOf(q)>-1;
      li.classList.toggle('hidden',!m); if(m){anyCat=true;shown++;}
    });
    cat.classList.toggle('hidden',!anyCat);
  });
  document.getElementById('stat').textContent = q ? (shown+' matching') : (Object.values(DATA).reduce(function(a,b){return a+b.length;},0)+' pages');
}

function copyOne(btn,url){
  navigator.clipboard.writeText(url).then(function(){ var t=btn.textContent; btn.textContent='Copied!'; setTimeout(function(){btn.textContent=t;},1200); });
}
function copyAll(){
  var all=[];
  for(var c in DATA){ DATA[c].forEach(function(u){ all.push(BASE+u); }); }
  navigator.clipboard.writeText(all.join('\n')).then(function(){ alert(all.length+' URLs copied to clipboard'); });
}

// highlight active sidebar link on scroll
function initScrollSpy(){
  var links=document.querySelectorAll('.side a[data-cat]');
  var cats=[].map.call(links,function(l){ return document.querySelector(l.getAttribute('href')); });
  window.addEventListener('scroll',function(){
    var y=window.scrollY+90, idx=0;
    cats.forEach(function(c,i){ if(c && c.offsetTop<=y) idx=i; });
    links.forEach(function(l,i){ l.classList.toggle('active',i===idx); });
  },{passive:true});
}

render();
initScrollSpy();
</script>
